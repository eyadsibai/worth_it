name: Playwright Tests

# A PR that touches backend/ or frontend/ runs the SMOKE_SPECS subset below.
# The full suite is too expensive to run per-PR, so it stays on the nightly
# schedule and on manual dispatch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "frontend/**"
      - "playwright/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/playwright.yml"
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Smallest set that still covers the three ways this app breaks in production:
  # the app/API failing to come up, the primary scenario calculation, and the
  # waterfall panel's preference-stack request.
  SMOKE_SPECS: >-
    playwright/tests/01-api-health.spec.ts
    playwright/tests/05-rsu-scenario-flow.spec.ts
    playwright/tests/09-waterfall-analysis.spec.ts

jobs:
  test:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 60 }}
    runs-on: ubuntu-latest
    steps:
    # Actions are pinned to commit SHAs: a mutable tag lets an upstream
    # compromise reach this runner, which builds and serves the app.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Nothing here pushes, and the job runs PR-authored test code.
        persist-credentials: false

    # Must precede setup-node: `cache: pnpm` shells out to pnpm to locate the store.
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend/pnpm-lock.yaml

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.14'

    - name: Install root dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Frontend dependencies
      run: |
        cd frontend
        pnpm install --frozen-lockfile

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        enable-cache: true

    - name: Install Backend dependencies
      run: |
        cd backend
        uv sync

    - name: Start Backend Server
      run: |
        cd backend
        uv run uvicorn worth_it.api:app --host 0.0.0.0 --port 8000 &
        for i in {1..30}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "Backend is ready"
            exit 0
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 2
        done
        echo "Backend never became ready"
        exit 1

    - name: Start Frontend Server
      run: |
        cd frontend
        pnpm dev &
        for i in {1..30}; do
          if curl -s http://localhost:3000 > /dev/null; then
            echo "Frontend is ready"
            exit 0
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 2
        done
        echo "Frontend never became ready"
        exit 1

    - name: Run Playwright smoke tests
      if: github.event_name == 'pull_request'
      run: pnpm exec playwright test $SMOKE_SPECS

    - name: Run Playwright full suite
      if: github.event_name != 'pull_request'
      run: pnpm exec playwright test

    - name: Upload Playwright Report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: playwright-results
        path: test-results/
        retention-days: 30
