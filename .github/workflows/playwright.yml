name: Playwright Tests

# A PR that touches backend/ or frontend/ runs the SMOKE_SPECS subset below.
# The full suite is too expensive to run per-PR, so it stays on the nightly
# schedule and on manual dispatch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "frontend/**"
      - "playwright/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/playwright.yml"
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Smallest set that still covers the three ways this app breaks in production:
  # the app/API failing to come up, the primary scenario calculation, and the
  # waterfall panel's preference-stack request.
  SMOKE_SPECS: >-
    playwright/tests/01-api-health.spec.ts
    playwright/tests/05-rsu-scenario-flow.spec.ts
    playwright/tests/09-waterfall-analysis.spec.ts

jobs:
  test:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 60 }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Must precede setup-node: `cache: pnpm` shells out to pnpm to locate the store.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend/pnpm-lock.yaml

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install root dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Frontend dependencies
      run: |
        cd frontend
        pnpm install --frozen-lockfile

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Backend dependencies
      run: |
        cd backend
        uv sync

    - name: Start Backend Server
      run: |
        cd backend
        uv run uvicorn worth_it.api:app --host 0.0.0.0 --port 8000 &
        for i in {1..30}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "Backend is ready"
            exit 0
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 2
        done
        echo "Backend never became ready"
        exit 1

    - name: Start Frontend Server
      run: |
        cd frontend
        pnpm dev &
        for i in {1..30}; do
          if curl -s http://localhost:3000 > /dev/null; then
            echo "Frontend is ready"
            exit 0
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 2
        done
        echo "Frontend never became ready"
        exit 1

    - name: Run Playwright smoke tests
      if: github.event_name == 'pull_request'
      run: pnpm exec playwright test $SMOKE_SPECS

    - name: Run Playwright full suite
      if: github.event_name != 'pull_request'
      run: pnpm exec playwright test

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-results
        path: test-results/
        retention-days: 30
