name: Playwright PR Review

# Review-only: this workflow critiques changes to the spec files themselves and
# executes no tests. The E2E gate is the smoke job in playwright.yml, which is
# what runs for PRs touching backend/ or frontend/.
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "playwright/**"

jobs:
  playwright-review:
    runs-on: ubuntu-latest
    environment: pr-action
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pinned to v1's commit, not @beta. The inputs below (`prompt`,
      # `claude_args`, `track_progress`) are the v1 API; @beta still serves v0,
      # which rejects all three with "Unexpected input(s)" and fails this job on
      # every PR. Pinning also matches the SHA policy in playwright.yml — a
      # mutable tag lets an upstream compromise reach a runner holding an OAuth
      # token and `pull-requests: write`. `v1` is an annotated tag, so this is
      # the dereferenced commit, not the tag object.
      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true # Enables tracking comments
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This PR modifies critical playwright files.

            Please provide a playwright-focused review with emphasis on:
            - Playwright best practices
            - Playwright code quality
            - Playwright code structure
            - Playwright code readability

            Note: The PR branch is already checked out.

            Post detailed playwright findings as PR comments.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
